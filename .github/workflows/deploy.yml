name: Deploy Ernte-Retter

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest

      - name: Run Pytest (Backend Tests)
        run: |
          pytest

      - name: Set up Node.js (Frontend Build Check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Check Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Ernte-Retter
            
            # 1. Neuesten Code aus Git ziehen
            git fetch origin main
            git reset --hard origin/main

            # 2. .env-Datei aus GitHub Secrets generieren
            cat << 'EOF' > .env
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            EOF

            # 3. Docker-Container neu erzeugen und im Hintergrund starten
            docker compose up -d --build --force-recreate

            # 4. Robuster Healthcheck direkt im Backend-Container
            echo "Warte darauf, dass das Backend im Container bereit ist..."
            for i in {1..30}; do
              if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')" 2>/dev/null; then
                echo "Backend ist erreichbar und bereit!"
                exit 0
              fi
              echo "Versuch $i/30: Backend bootet noch, warte 2 Sekunden..."
              sleep 2
            done

            echo "Fehler: Backend hat nicht rechtzeitig geantwortet."
            exit 1

      - name: Invalidate CloudFront Cache
        uses: chetan/invalidate-cloudfront-action@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          distribution-id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          paths: "/*"
