name: Deploy Ernte-Retter

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # nötig für die AWS-Anmeldung per OIDC
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest

      - name: Run Pytest (Backend Tests)
        run: |
          pytest

      - name: Set up Node.js (Frontend Build Check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Check Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Ernte-Retter

            # 1. Neuesten Code aus Git ziehen
            git fetch origin main
            git reset --hard origin/main

            # 2. .env zuerst in eine Hilfsdatei schreiben und prüfen,
            #    damit eine fehlerhafte Datei nie die laufende Seite beschädigt
            cat << 'EOF' > .env.new
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            EOF

            for var in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB SECRET_KEY; do
              value=$(grep "^${var}=" .env.new | cut -d= -f2-)
              if [ -z "$value" ]; then
                echo "Fehler: GitHub-Secret ${var} ist leer oder nicht angelegt."
                rm -f .env.new
                exit 1
              fi
            done
            chmod 600 .env.new
            mv .env.new .env

            # 3. Docker-Container neu erzeugen und im Hintergrund starten
            docker compose up -d --build --force-recreate

            # 4. Healthcheck direkt im Backend-Container
            echo "Warte darauf, dass das Backend im Container bereit ist..."
            for i in {1..30}; do
              if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')" 2>/dev/null; then
                echo "Backend ist erreichbar und bereit!"
                exit 0
              fi
              echo "Versuch $i/30: Backend bootet noch, warte 2 Sekunden..."
              sleep 2
            done

            echo "Fehler: Backend hat nicht rechtzeitig geantwortet."
            echo "---- docker compose ps ----"
            docker compose ps
            echo "---- Backend-Log (letzte 40 Zeilen) ----"
            docker compose logs --tail=40 backend
            echo "---- DB-Log (letzte 15 Zeilen) ----"
            docker compose logs --tail=15 db
            exit 1

      - name: AWS-Anmeldung per OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: CloudFront-Cache invalidieren
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          --paths "/*"
