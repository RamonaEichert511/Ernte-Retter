name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python Umgebung einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Abhängigkeiten installieren & Tests ausführen
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Falls pytest noch nicht in den Requirements steht, installieren wir es fix mit
          pip install pytest httpx
          # Führt automatische Tests aus (z.B. im Ordner /tests)
          pytest

      - name: Deploy via SSH auf AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "Ernte-Retter" ]; then
              git clone https://github.com/RamonaEichert511/Ernte-Retter.git
            fi
            cd Ernte-Retter
            git fetch origin main
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build

            for i in $(seq 1 15); do
              if curl -fs http://localhost:8000/docs > /dev/null; then
                echo "Backend läuft"
                exit 0
              fi
              sleep 4
            done
            echo "Backend antwortet nicht, letzte Logzeilen:"
            docker compose logs --tail=30 backend
            exit 1

      - name: AWS-Anmeldung per OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: CloudFront-Cache invalidieren
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          --paths "/*"
